augmentation:
  train: ~
  inference:
    - 
      name: posetopdownaffine
      scale: [1., 1.]
      scale_prob: 0.
      translate: 0.
      translate_prob: 0.
      rotation: 0
      rotation_prob: 0.
      size: [256, 256]
    -
      name: totensor
      pixel_range: 1.0
    -
      name: normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
